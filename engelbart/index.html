<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engelbart · Mathetic</title>
  <meta name="description" content="Engelbart keeps your goals, plans, and problems in context while you build.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/engelbart/styles.css">
</head>
<body>
  <nav class="landing-bar" aria-label="Primary">
    <a class="wordmark" href="/">Mathetic</a>
    <div class="nav-actions">
      <a class="pill" href="/engelbart/signin">Sign in</a>
      <a class="pill" href="/engelbart/signin?mode=signup">Create account</a>
    </div>
  </nav>

  <main class="landing">
    <header class="dm-hero">
      <h1 class="dm-title">Engelbart</h1>
      <p class="dm-tagline">Keep your goals, plans, and problems in context while building.</p>
      <div class="dm-install">
        <button id="copy-cmd" class="dm-cmd" type="button" title="Copy install command">
          <span class="dm-cmd-prompt" aria-hidden="true">$</span>
          <span id="install-command" class="dm-cmd-text">curl -fsSL https://berkeley.mathetic.com/engelbart/install.sh | sh</span>
          <svg id="copy-cmd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="12" height="12" rx="1.5"></rect><path d="M9 6.5 V4.5 A1.5 1.5 0 0 1 10.5 3 H19.5 A1.5 1.5 0 0 1 21 4.5 V13.5 A1.5 1.5 0 0 1 19.5 15 H17.5"></path></svg>
        </button>
        <div class="dm-install-tabs" role="group" aria-label="Install method">
          <button class="dm-install-tab is-on" type="button" data-install-mode="standard" aria-pressed="true">Standard</button>
          <button class="dm-install-tab" type="button" data-install-mode="developer" aria-pressed="false">Developer</button>
        </div>
      </div>
    </header>

    <div id="demo" class="dm-demo">
      <div id="demo-canvas" class="da-canvas" role="img" aria-label="Engelbart turning a project description into structured goals, notes, and agent tasks."></div>
      <button id="demo-toggle" class="da-toggle" type="button" aria-label="Pause animation">Pause</button>
    </div>

    <footer class="colophon">
      <a href="/">Mathetic</a>
      <a href="/engelbart/admin">Admin</a>
    </footer>
  </main>

  <script src="/engelbart/demo.js"></script>
</body>
</html>
