<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engelbart · Mathetic</title>
  <meta name="description" content="Engelbart keeps your goals, plans, and problems in context while you build.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/engelbart/styles.css">
</head>
<body>
  <nav class="landing-bar" aria-label="Primary">
    <a class="wordmark" href="/">Mathetic</a>
    <div class="nav-actions">
      <a class="pill" href="/engelbart/signin">Sign in</a>
      <a class="pill" href="/engelbart/signin?mode=signup">Create account</a>
    </div>
  </nav>

  <main class="landing">
    <header class="dm-hero">
      <h1 class="dm-title">Engelbart</h1>
      <p class="dm-tagline">Keep your goals, plans, and problems in context while building.</p>
      <button id="copy-cmd" class="dm-cmd" type="button" title="click to copy">npx engelbart-cli<svg id="copy-cmd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="12" height="12" rx="1.5"></rect><path d="M9 6.5 V4.5 A1.5 1.5 0 0 1 10.5 3 H19.5 A1.5 1.5 0 0 1 21 4.5 V13.5 A1.5 1.5 0 0 1 19.5 15 H17.5"></path></svg></button>
    </header>

    <!-- A recording of the real thing. It carries its own frame and shadow, so
         it gets no panel chrome here - a second border around a bordered
         screenshot reads as a mistake. -->
    <figure class="dm-reel">
      <video
        src="/uploads/engelbart-demo.mp4"
        poster="/uploads/engelbart-demo-poster.jpg"
        width="1200" height="676"
        autoplay muted loop playsinline preload="auto"
        aria-label="A recording of Engelbart: it reads back what you are working on, then agents build the goals while you review the physics."></video>
      <figcaption class="visually-hidden">Engelbart asks what to build first, plays back its
        understanding of the project, and then runs agents against the goals while you review
        the physics rather than the diffs.</figcaption>
    </figure>

    <footer class="colophon">
      <a href="/">Mathetic</a>
      <a href="/engelbart/admin">Admin</a>
    </footer>
  </main>

  <script src="/engelbart/landing.js"></script>
</body>
</html>
