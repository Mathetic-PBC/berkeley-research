# LiteLLM proxy configuration — source of truth for the Engelbart data plane.
#
# Deployed separately from this repo (Railway service
# `engelbart-litellm-production`). Vercel never sees ANTHROPIC_API_KEY; it only
# holds LITELLM_BASE_URL and LITELLM_MASTER_KEY and asks this proxy to mint one
# virtual key per student.

model_list:
  # Order matters: the more specific pattern has to be matched first, otherwise
  # the bare catch-all below turns "anthropic/claude-x" into
  # "anthropic/anthropic/claude-x".
  - model_name: "anthropic/*"
    litellm_params:
      model: "anthropic/*"
      api_key: os.environ/ANTHROPIC_API_KEY

  # Claude Code sends bare, dated model ids over ANTHROPIC_BASE_URL —
  # "claude-sonnet-4-5-20250929", "claude-3-5-haiku-20241022" — with no provider
  # prefix. Pinning model names here is what broke it: every name goes stale the
  # next time Anthropic ships a model. The matched portion is substituted into
  # the target, so this routes any Claude id straight through to Anthropic.
  - model_name: "*"
    litellm_params:
      model: "anthropic/*"
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  # Claude Code sends params LiteLLM may not recognise on a brand-new model id;
  # drop them rather than failing the request.
  drop_params: true
